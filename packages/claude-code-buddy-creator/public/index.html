<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="theme-color"
      content="#fdf6e3"
    />
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <link
      rel="canonical"
      href="https://tools.carter.works/claude-code-buddy-creator/"
    />
    <meta
      property="og:url"
      content="https://tools.carter.works/claude-code-buddy-creator/"
    />
    <meta
      property="og:locale"
      content="en_US"
    />
    <meta
      property="og:site_name"
      content="Carter McBride"
    />
    <link
      rel="icon"
      href="https://carter.works/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="alternate"
      type="application/rss+xml"
      href="https://carter.works/blog/feed.xml"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
    />
    <title>Claude Code Buddy Creator | tools.carter.works</title>

    <meta
      property="og:title"
      content="Claude Code Buddy Creator"
    />
    <meta
      property="og:type"
      content="website"
    />

    <script type="module" src="./main.js"></script>
    <style is:global>
      :root {
        --bg: rgb(240, 240, 240);
        --text: rgb(0, 0, 0);
        --claude: rgb(215, 119, 87);
        --subtle: rgb(175, 175, 175);
        --inactive: rgb(102, 102, 102);
        --mono: "Geist Mono", var(--font-mono);
        --sans:
          Inter, Roboto, "Helvetica Neue", "Arial Nova", "Nimbus Sans", Arial,
          sans-serif;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        transition:
          background-color 300ms ease,
          color 300ms ease;
      }

      .page-nav {
        padding: 1rem;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        transition: color 300ms ease;
      }

      .page-main {
        width: min(100%, 42rem);
        margin: 0 auto;
        padding: 1rem;
      }

      .page-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .page-title {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .theme-switcher-label,
      .seed-row,
      .card-actions {
        display: flex;
        gap: 0.5rem;
      }

      .theme-switcher-label {
        align-items: center;
        font-size: 0.875rem;
        padding: 0.35rem 0.45rem 0.35rem 0.8rem;
        border: 1px solid color-mix(in srgb, var(--inactive) 55%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 28px -24px rgba(0, 0, 0, 0.7);
      }

      .app-copy {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        border: 1px solid color-mix(in srgb, var(--inactive) 35%, transparent);
        border-radius: 1rem;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        box-shadow: 0 18px 45px -38px rgba(0, 0, 0, 0.75);
        font-size: 0.875rem;
      }

      .app-copy p {
        margin: 0;
      }

      .inline-link {
        margin-inline: 0.5ch;
        text-decoration: underline;
      }

      .seed-row {
        align-items: stretch;
        margin-top: 0.35rem;
      }

      .result-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      .card-shell {
        display: inline-block;
      }

      .card-display {
        transform: rotateX(var(--display-rx)) rotateY(var(--display-ry))
          rotate(var(--display-rz));
      }

      .card-text {
        display: inline-block;
      }

      .card-accent {
        color: var(--card-accent);
      }

      .card-inactive {
        color: var(--card-inactive);
      }

      .card-text-color {
        color: var(--card-text);
      }

      .card-actions {
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        padding: 0.75rem 0.9rem;
        border: 1px solid color-mix(in srgb, var(--inactive) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--bg) 86%, transparent);
        box-shadow: 0 18px 30px -26px rgba(0, 0, 0, 0.55);
      }

      .seed-note {
        font-size: 0.75rem;
      }

      .creator-details {
        margin-top: 1rem;
      }

      .creator-summary {
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.875rem;
        color: var(--inactive);
        user-select: none;
        letter-spacing: 0.02em;
      }

      .builder-panel {
        display: grid;
        gap: 0.5rem 0.75rem;
        align-items: center;
        margin-top: 1rem;
        padding: 1.1rem;
        border: 1px solid;
        border-radius: 1rem;
        border-color: color-mix(in srgb, var(--inactive) 28%, transparent);
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--bg) 96%, transparent),
          color-mix(in srgb, var(--subtle) 52%, transparent)
        );
        grid-template-columns: auto 1fr auto;
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, white 14%, transparent),
          0 20px 40px -34px rgba(0, 0, 0, 0.8);
        transition:
          background-color 300ms ease,
          border-color 300ms ease,
          box-shadow 300ms ease;
      }

      .control-label,
      .stat-label,
      .stat-value,
      .geist-mono {
        font-family: var(--mono);
      }

      .control-label,
      .stat-label,
      .seed-note {
        color: var(--inactive);
      }

      .stat-value {
        color: var(--text);
        text-align: right;
      }

      .control-label,
      .theme-switcher-select,
      .control-select,
      .text-input,
      .seed-input,
      .icon-button,
      .small-button {
        font-size: 0.875rem;
      }

      .stat-label,
      .stat-value,
      .small-button,
      .seed-note {
        font-size: 0.75rem;
      }

      .control-label,
      .stat-label,
      .stat-value {
        align-self: center;
      }

      .theme-switcher-select,
      .control-select,
      .text-input,
      .seed-input,
      .icon-button,
      .small-button {
        border: 1px solid color-mix(in srgb, var(--inactive) 72%, transparent);
        border-radius: 0.8rem;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--bg) 97%, white 3%),
          color-mix(in srgb, var(--bg) 90%, var(--subtle) 10%)
        );
        color: var(--text);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, white 14%, transparent),
          0 8px 24px -20px rgba(0, 0, 0, 0.65);
        transition:
          transform 150ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 200ms ease,
          background-color 300ms ease,
          border-color 300ms ease,
          color 300ms ease;
      }

      .theme-switcher-select,
      .control-select,
      .text-input {
        min-height: 2.6rem;
        padding: 0.55rem 0.85rem;
        font-family: var(--mono);
      }

      .seed-input {
        flex: 1;
        min-height: 3rem;
        padding: 0.8rem 0.95rem;
        font-family: var(--mono);
        outline: none;
      }

      .icon-button {
        min-width: 3rem;
        padding: 0.75rem 1rem;
        cursor: pointer;
      }

      .small-button {
        padding: 0.55rem 0.9rem;
        cursor: pointer;
      }

      .checkbox-input {
        grid-column: 2 / -1;
        justify-self: start;
      }

      .control-select,
      .text-input {
        grid-column: 2 / -1;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* --- Atmosphere: subtle terminal dot-grid --- */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(circle at 50% 50%, transparent 0%, var(--bg) 100%),
          radial-gradient(
            circle,
            rgba(128, 128, 128, 0.18) 1px,
            transparent 1px
          );
        background-size:
          100% 100%,
          18px 18px;
        pointer-events: none;
        z-index: -1;
      }

      /* --- Entrance choreography --- */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes cardMaterialize {
        from {
          opacity: 0;
          transform: scale(0.96);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: blur(0px);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @keyframes subtleFloat {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }

      .animate-entrance {
        animation: fadeUp 450ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      .animate-entrance-1 {
        animation-delay: 0ms;
      }
      .animate-entrance-2 {
        animation-delay: 80ms;
      }
      .animate-entrance-3 {
        animation-delay: 160ms;
      }

      .card-entrance {
        animation: cardMaterialize 500ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      /* --- Title glow --- */
      .title-glow {
        color: var(--claude, rgb(215, 119, 87));
        text-shadow: 0 0 30px rgba(215, 119, 87, 0.35);
        letter-spacing: -0.02em;
      }

      .geist-mono {
        font-family: var(--mono);
      }

      /* --- Button & control micro-interactions --- */
      button,
      select {
        transition:
          transform 150ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 200ms ease,
          background-color 300ms ease,
          border-color 300ms ease !important;
      }

      @media (hover: hover) and (pointer: fine) {
        button:hover,
        select:hover {
          box-shadow:
            0 0 12px rgba(215, 119, 87, 0.18),
            0 16px 30px -24px rgba(0, 0, 0, 0.7);
          border-color: color-mix(in srgb, var(--claude) 45%, var(--inactive));
        }

        .text-input:hover,
        .seed-input:hover,
        .control-select:hover,
        .theme-switcher-select:hover {
          background: linear-gradient(
            180deg,
            color-mix(in srgb, var(--bg) 99%, white 1%),
            color-mix(in srgb, var(--bg) 94%, var(--subtle) 6%)
          );
        }
      }

      button:active {
        transform: scale(0.97) !important;
      }

      /* --- Input focus ring --- */
      input[type="text"]:focus {
        box-shadow: 0 0 0 2px rgba(215, 119, 87, 0.25);
        border-color: var(--claude, rgb(215, 119, 87)) !important;
        outline: none;
      }

      /* --- Details/summary animation --- */
      details[open] > :not(summary) {
        animation: fadeUp 250ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }

      summary {
        transition: color 150ms ease;
      }

      @media (hover: hover) and (pointer: fine) {
        summary:hover {
          color: var(--claude, rgb(215, 119, 87)) !important;
        }
      }

      summary::marker {
        color: var(--claude, rgb(215, 119, 87));
      }

      /* --- Shiny card holographic overlay --- */
      .shiny-overlay {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        background: linear-gradient(
          105deg,
          transparent 20%,
          rgba(255, 200, 100, 0.1) 30%,
          rgba(100, 200, 255, 0.1) 40%,
          rgba(255, 100, 200, 0.1) 50%,
          rgba(100, 255, 200, 0.1) 60%,
          transparent 80%
        );
        background-size: 200% 100%;
        animation: shimmer 3s linear infinite;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      .shiny-badge {
        position: absolute;
        top: 6px;
        right: 8px;
        font-size: 14px;
        animation: subtleFloat 2s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
        color: var(--claude, rgb(215, 119, 87));
        text-shadow: 0 0 8px rgba(215, 119, 87, 0.6);
      }

      /* --- Range & checkbox accent --- */
      input[type="range"] {
        accent-color: var(--claude, rgb(215, 119, 87));
      }
      input[type="checkbox"] {
        accent-color: var(--claude, rgb(215, 119, 87));
      }

      /* --- Link hover --- */
      a {
        transition:
          color 150ms ease,
          text-shadow 150ms ease;
      }
      @media (hover: hover) and (pointer: fine) {
        a:hover {
          text-shadow: 0 0 10px currentColor;
        }
      }

      /* --- Scrollbar --- */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--inactive, rgb(102, 102, 102));
        border-radius: 3px;
      }

      /* --- Accessibility: respect reduced motion --- */
      @media (prefers-reduced-motion: reduce) {
        .animate-entrance,
        .card-entrance,
        details[open] > :not(summary) {
          animation: none;
        }
        .shiny-overlay,
        .shiny-badge {
          animation: none;
        }
        button,
        select,
        a,
        summary,
        input[type="text"] {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <nav class="page-nav animate-entrance animate-entrance-1">
      <a
        href="/"
        class="back-link"
        ><span aria-hidden="true">&larr;</span> Tools index</a
      >
    </nav>
    <main class="page-main">
      <div class="page-header animate-entrance animate-entrance-2">
        <h1 class="page-title title-glow">Claude Code Buddy Creator</h1>
        <div id="theme-switcher"></div>
      </div>
      <div
        id="buddy-app"
        class="animate-entrance animate-entrance-3"
      >
      </div>
    </main>
  </body>
</html>
